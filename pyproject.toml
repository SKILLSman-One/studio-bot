[project]
name = "studio-bot"
version = "0.7.2"
requires-python = ">=3.11"
# Keep this list in sync with requirements.txt: some hosts prefer uv over pip.
dependencies = [
    "aiofiles==25.1.0",
    "aiogram==3.31.0",
    "aiohappyeyeballs==2.7.1",
    "aiohttp==3.14.5",
    "aiosignal==1.4.0",
    "annotated-types==0.8.0",
    "attrs==26.1.0",
    "certifi==2026.7.22",
    "cffi==2.1.1",
    "charset-normalizer==3.5.2",
    "cryptography==50.0.2",
    "frozenlist==1.8.0",
    "google-auth==2.62.0",
    "idna==3.20",
    "magic-filter==1.0.12",
    "multidict==7.1.0",
    "propcache==0.5.4",
    "pyasn1==0.6.4",
    "pyasn1_modules==0.4.2",
    "pycparser==3.11",
    "pydantic==2.13.5",
    "pydantic_core==2.46.5",
    "python-dotenv==1.2.3",
    "requests==2.34.2",
    "typing-inspection==0.4.4",
    "typing_extensions==4.16.0",
    "tzdata==2026.5",
    "urllib3==2.8.0",
    "yarl==1.25.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
